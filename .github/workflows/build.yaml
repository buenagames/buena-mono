name: Build font and specimen

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # A full font build -- fontmake across 8 masters, fontspector, proofs --
    # costs the same minutes whether a glyph changed or a typo did. Skip the
    # paths that cannot affect the built font or the packaged output.
    # Path filters are NOT evaluated for tag pushes, so release builds still
    # run on every tag regardless of what changed.
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'marketing/**'
      # GF submission metadata — no Makefile target reads either.
      - 'catalog/**'
      - 'upstream.yaml'
      # Publish- and release-time tooling. These are invoked by the `publish`
      # and `release` targets only; the build/test/proof chain never runs them.
      - 'scripts/publish-public.sh'
      - 'scripts/scrub-public.py'
      - 'scripts/sync-release.sh'
      - 'scripts/stage-gf-pr.sh'
    tags:
      - '*'

# One run per ref: a newer push supersedes an in-flight one. Tag builds are
# never cancelled -- a cancelled release run produces no bundle.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: write-all

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Setup fontspector
      # Pinned to a commit: this action publishes no tags or releases, so @main
      # would let an upstream push change the build with no commit here.
      uses: fonttools/setup-fontspector@d53404291dc78a5a41cf76ea48e1d13a731fb812
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install toolset
      run: |
        sudo apt-get update
        # -y is required: apt aborts non-interactively as soon as it needs to
        # pull a dependency beyond the named packages.
        sudo apt-get install -y ttfautohint libcairo2-dev python3-cairo-dev pkg-config python3-dev
        sudo snap install yq
    - uses: actions/cache@v4
      with:
        path: ./venv/
        key: ${{ runner.os }}-venv-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-venv-
    - name: Set artifact file name
      id: zip-name
      shell: bash
      # Set the archive name to repo name + "-fonts" e.g "radiocanadafonts-fonts.zip"
      run: echo "ZIP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')-fonts" >> $GITHUB_ENV

    # If a new release is cut, use the release tag to auto-bump the source files
    # - name: Bump release
    #   if: github.event_name == 'release'
    #   run: |
    #     . venv/bin/activate
    #     SRCS=$(yq e ".sources[]" sources/config.yaml)
    #     TAG_NAME=${GITHUB_REF/refs\/tags\//}
    #     echo "Bumping $SRCS to $TAG_NAME"
    #     for src in $SRCS
    #     do
    #       bumpfontversion sources/$src --new-version $TAG_NAME;
    #     done

    - name: Build font
      run: make build
    - name: Check with fontspector
      run: make test
      continue-on-error: true
    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: out
    outputs:
      zip_name: ${{ env.ZIP_NAME }}


  # There are two ways a release can be created: either by pushing a tag, or by
  # creating a release from the GitHub UI. Pushing a tag does not automatically
  # create a release, so we have to do that ourselves. However, creating a
  # release from the GitHub UI *does* push a tag, and we don't want to create
  # a new release in that case because one already exists!

  release:
    name: Release bundle
    if: contains(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: ${{ needs.build.outputs.zip_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Use font artifacts from CI
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
      - name: Copy ARTICLE.en_us.html to release directory
        run: cp docs/ARTICLE.en_us.html ${{ env.ZIP_NAME }}/ARTICLE.en_us.html
        continue-on-error: true
      - name: Copy OFL.txt to release directory
        run: cp OFL.txt ${{ env.ZIP_NAME }}/OFL.txt
      - name: Remove proof/test outputs from release
        run: rm -rf ${{ env.ZIP_NAME }}/proof ${{ env.ZIP_NAME }}/fontspector ${{ env.ZIP_NAME }}/badges ${{ env.ZIP_NAME }}/index.html
      - name: Set release file name
        shell: bash
        run: echo "RELEASE_ZIP_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')-${{github.ref_name}}" >> $GITHUB_ENV
      - name: Create release bundle
        run: mv ${{ env.ZIP_NAME }} ${{ env.RELEASE_ZIP_NAME }}; zip -r ${{ env.RELEASE_ZIP_NAME }}.zip ${{ env.RELEASE_ZIP_NAME }}
      - name: Check for release
        id: create_release
        run: |
          if ! gh release view ${{ github.ref_name }}; then
          git show -s --format=%B ${{ github.ref_name }} | tail -n +4 | gh release create ${{ github.ref_name }} -t ${{ github.ref_name }} -F -
          fi
      - name: Populate release
        run: |
          gh release upload ${{ github.ref_name }} ${{ env.RELEASE_ZIP_NAME }}.zip --clobber
      - name: Set release live
        run: |
          gh release edit ${{ github.ref_name }} --draft=false
