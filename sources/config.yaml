# Buena Mono - Build Configuration
# https://github.com/buenagames/buena-mono

sources:
  - BuenaMono.designspace

familyName: "Buena Mono"

# Build targets
buildOTF: false
buildTTF: false
buildSmallCap: false

# Autohinting
autohintTTF: true

# STAT table configuration for variable fonts
# v1.217: wght 100-800 × slnt 0 to -10, 8 masters (4 upright + 4 italic)
stat:
  - name: Weight
    tag: wght
    values:
    - name: Thin
      value: 100
    - name: ExtraLight
      value: 200
    - name: Light
      value: 300
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
  - name: Slant
    tag: slnt
    values:
    - name: Default
      value: 0
      flags: 2
